services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: student_support_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: student_support_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: student_support_postgres
    environment:
      POSTGRES_USER: student_agent
      POSTGRES_PASSWORD: student_agent_dev
      POSTGRES_DB: student_support_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: student_support_pgweb
    environment:
      DATABASE_URL: postgres://student_agent:student_agent_dev@postgres:5432/student_support_db?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
