[project]
name = "intelligent-student-support-agent"
version = "0.1.0"
description = "Intelligent Student Support Agent with Multi-turn Tool-calling, Memory, RAG, and Observability"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "openai>=1.14.0",
    "groq>=0.11.0",
    "qdrant-client>=1.8.0",
    "langchain-qdrant>=0.1.0",
    "pymupdf>=1.23.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-text-splitters>=0.0.1",
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0, <4.46.0",
    "einops>=0.7.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.3",
    "loguru>=0.7.2",
    "langsmith>=0.1.20",
    "streamlit>=1.32.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "alembic>=1.13.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tracing*"]

